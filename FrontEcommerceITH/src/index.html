<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <title>TechSuply</title>
  <meta name="description" content="Componentes de cómputo, repuestos de laptop y periféricos con verificación de compatibilidad. Envío incluido a todo el Perú.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Preferencias de accesibilidad (spec 018): se aplican antes del primer pintado para que no haya un destello del tema claro.
       La misma lógica vive en PreferenciasA11yService; si cambia una, cambia la otra. -->
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('ts_pref_accesibilidad') || '{}');
        var d = document.documentElement.dataset;
        var m = function (q) { return window.matchMedia && matchMedia(q).matches; };
        d.tema = p.tema === 'claro' || p.tema === 'oscuro' ? p.tema : m('(prefers-color-scheme: dark)') ? 'oscuro' : 'claro';
        d.contraste = p.contraste === 'normal' || p.contraste === 'alto' ? p.contraste : m('(prefers-contrast: more)') ? 'alto' : 'normal';
        d.texto = p.texto === 'grande' || p.texto === 'muy-grande' ? p.texto : 'normal';
        d.espaciado = p.espaciado === 'ampliado' ? 'ampliado' : 'normal';
        d.movimiento = p.movimiento === 'reducido' ? 'reducido' : 'sistema';
        d.colores = p.colores === 'seguros' ? 'seguros' : 'normal';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
